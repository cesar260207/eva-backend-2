{% extends 'base.html' %}
{% block title %}Ingresar | SGR{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="panel"><div class="page-kicker">Acceso institucional</div><h1 class="page-title h3 mb-3">Ingresar al SGR</h1><p class="text-muted">Usa tu cuenta para acceder a las funciones autorizadas por tu perfil y delegación.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-sgr w-100" type="submit">Ingresar</button></form><p class="small text-center mt-3 mb-0"><a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a></p></div></div></div>{% endblock %}
