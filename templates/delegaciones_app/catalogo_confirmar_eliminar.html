{% extends 'base.html' %}
{% block title %}Confirmar eliminación | SGR{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="page-kicker">Administración · Catálogo</div>
        <h1 class="page-title mb-4">Confirmar eliminación</h1>
        <div class="panel">
            <p>¿Eliminar el ítem <strong>{{ objeto.codigo }} · {{ objeto.nombre }}</strong>?</p>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-light" href="{% url 'catalogo_lista' %}">Cancelar</a>
                    <button class="btn btn-danger" type="submit">Confirmar eliminación</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
