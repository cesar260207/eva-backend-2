{% extends "base.html" %}

{% block title %}{{ titulo }} | SGR{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9 col-xl-8">
        <div class="page-header">
            <div>
                <div class="page-kicker">Registro</div>
                <h1 class="page-title mb-2">{{ titulo }}</h1>
                <p class="page-intro mb-0">Los campos marcados con <span aria-hidden="true">*</span> son obligatorios.</p>
            </div>
        </div>
        <div class="panel">
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {% include 'includes/_formulario.html' %}
                <div class="form-acciones">
                    <a class="btn btn-light" href="{% url 'inicio' %}">Cancelar</a>
                    <button class="btn btn-sgr" type="submit">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
