{% load l10n %}{% comment %}Cifra que cuenta desde 0 al aparecer. El lector de pantalla lee el valor final; la animación es solo visual. Recibe «valor» y, si tiene, «decimales».{% endcomment %}<span class="visually-hidden">{{ valor }}</span><span aria-hidden="true" data-contar="{{ valor|unlocalize }}"{% if decimales %} data-decimales="{{ decimales }}"{% endif %}>{{ valor }}</span>
